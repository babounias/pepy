<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ΠΕΠΥ – Δοκιμή σύνδεσης με ΚΟΕ</title>
<style>
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#eaf6fb;margin:0;padding:20px;color:#0b3a5b}
  .box{max-width:720px;margin:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(0,60,100,.12)}
  h1{margin:0 0 6px;color:#0a83c4}
  p{line-height:1.5}
  label{display:inline-block;margin:6px 12px 6px 0;font-weight:600}
  input{width:90px;padding:6px;border:1px solid #9cc;border-radius:8px;font-size:15px}
  button{background:#16b4e6;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:700;cursor:pointer;margin:10px 8px 10px 0}
  button:disabled{background:#9bbfcc;cursor:default}
  #save{background:#1a9a4b;display:none}
  ul{list-style:none;padding:0}
  li{padding:7px 10px;border-bottom:1px solid #e3eef3;font-size:14px}
  .ok{color:#1a9a4b}.bad{color:#c0392b}.wait{color:#999}
  #msg{font-weight:700;font-size:16px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
  <h1>🏊 ΠΕΠΥ – Δοκιμή</h1>
  <p>Πάτα <b>«Ξεκίνα»</b>. Θα ρωτήσει την ΚΟΕ για μερικά πράγματα, <b>αργά-αργά</b> (κάθε 3 δευτερόλεπτα, για να μη μας κόψουν). Θέλει περίπου 1 λεπτό.<br>
  Στο τέλος πάτα το πράσινο κουμπί για να κατέβει το αρχείο <b>pepy_dokimi.json</b> και στείλ' το στον Claude.</p>
  <div>
    <label>Διοργάνωση <input id="comp" value="9191"></label>
    <label>Σωματείο <input id="club" value="701"></label>
    <label>ΑΜ αθλητή <input id="am" value="209807"></label>
  </div>
  <button id="go">Ξεκίνα</button>
  <button id="save">⬇ Κατέβασε το αποτέλεσμα</button>
  <div id="msg"></div>
  <ul id="list"></ul>
</div>
<script>
const B = "https://live.koe.org.gr/";
function urls(c, k, a){
  const G = "%CE%93"; // Γ = Γυναίκες
  return [
    ["Ρυθμίσεις: legend", "assets/legend.json"],
    ["Ρυθμίσεις: sports_config", "assets/sports_config.json"],
    ["Σεζόν", "api-gen/Racingseasons?Code="],
    ["Αγωνίσματα (Discipline)", "api-gen/Discipline?Code="],
    ["Αγωνίσματα (Recordevent)", "api/Recordevent?SportCode=1"],
    ["Στοιχεία διοργάνωσης", `api/Detailorg?RacingSeason=&SportCode=&CompetitionCode=${c}`],
    ["Πρόγραμμα (Schedule)", `api/Schedules?OrganizationID=&CompetitionCode=${c}`],
    ["Σωματεία διοργάνωσης", `api/Clubs?CompetitionCode=${c}&OrganizationID=`],
    ["Συμμετοχές σωματείου", `api/Clubseventsentries?OrganizationID=&CompetitionCode=${c}&ClubCode=${k}`],
    ["Αθλητής στη διοργάνωση", `api/Athletes?OrganizationID=&CompetitionCode=${c}&RegistrationNumber=${a}`],
    ["Αποτελέσματα αγωνίσματος", `api/Results?OrganizationID=&CompetitionCode=${c}&UnitCode=4E363E29-AB65-44CD-85EE-3B6D0FA01EEA`],
    ["Χρόνοι αθλητή 2026-27, 25άρα", `api/Bestresultathlete?Sportcode=1&Eventcode=9&Racingseasonfrom=2026&Racingseasonto=2027&Poolsize=25&Gender=${G}&Clubcode=${k}&Registrationnumber=${a}`],
    ["Χρόνοι αθλητή 2026-27, 50άρα", `api/Bestresultathlete?Sportcode=1&Eventcode=9&Racingseasonfrom=2026&Racingseasonto=2027&Poolsize=50&Gender=${G}&Clubcode=${k}&Registrationnumber=${a}`],
    ["Χρόνοι αθλητή 2018-27 (δοκιμή >2 σεζόν)", `api/Bestresultathlete?Sportcode=1&Eventcode=9&Racingseasonfrom=2018&Racingseasonto=2027&Poolsize=25&Gender=${G}&Clubcode=${k}&Registrationnumber=${a}`],
    ["Χρόνοι αθλητή, χωρίς αγώνισμα", `api/Bestresultathlete?Sportcode=1&Eventcode=&Racingseasonfrom=2026&Racingseasonto=2027&Poolsize=25&Gender=${G}&Clubcode=${k}&Registrationnumber=${a}`],
    ["Best results κατηγορίας", `api/Bestresult?Sportcode=1&Eventcode=1&Racingseasonfrom=2027&Racingseasonto=2027&Poolsize=25&Gender=${G}&Birthdatefrom=2015-01-01&Birthdateto=2015-12-31`]
  ];
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
let report = null;

async function getOne(path){
  const url = B + path;
  for (let attempt = 1; attempt <= 2; attempt++){
    try{
      const r = await fetch(url, {headers:{"Accept":"application/json, text/plain, */*"}});
      const text = await r.text();
      if (r.status === 429 && attempt === 1){ await sleep(12000); continue; }
      return {url, status:r.status, ok:r.ok, length:text.length, body:text};
    }catch(e){
      return {url, status:0, ok:false, error:String(e)};
    }
  }
}

document.getElementById("go").onclick = async () => {
  const go = document.getElementById("go"), save = document.getElementById("save");
  const list = document.getElementById("list"), msg = document.getElementById("msg");
  go.disabled = true; save.style.display = "none"; list.innerHTML = "";
  const c = comp.value.trim(), k = club.value.trim(), a = am.value.trim();
  const items = urls(c, k, a);
  report = {created:new Date().toISOString(), page:location.href, userAgent:navigator.userAgent, comp:c, club:k, am:a, results:[]};
  let good = 0;
  for (let i = 0; i < items.length; i++){
    const [name, path] = items[i];
    const li = document.createElement("li");
    li.innerHTML = `<span class="wait">⏳</span> ${name}`;
    list.appendChild(li);
    msg.textContent = `Ρωτάω ${i+1} από ${items.length}…`;
    const res = await getOne(path);
    res.name = name;
    report.results.push(res);
    if (res.ok){ good++; li.innerHTML = `<span class="ok">✅</span> ${name} <small>(${res.length} χαρακτήρες)</small>`; }
    else li.innerHTML = `<span class="bad">❌</span> ${name} <small>(${res.status || res.error})</small>`;
    await sleep(3000);
  }
  msg.innerHTML = good === items.length
    ? `<span class="ok">Τέλεια! Όλα ήρθαν (${good}/${items.length}). Κατέβασε το αρχείο και στείλ' το.</span>`
    : `Ήρθαν ${good} από ${items.length}. Κατέβασε το αρχείο και στείλ' το, θα δω τι έγινε.`;
  save.style.display = "inline-block"; go.disabled = false;
};

document.getElementById("save").onclick = () => {
  const blob = new Blob([JSON.stringify(report)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "pepy_dokimi.json";
  document.body.appendChild(a); a.click(); a.remove();
};
</script>
</body>
</html>
